name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Base extras only, deliberately. This job also proves the package is usable
      # without the optional backends -- it was not, and CI is what caught it.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Import without optional backends
        run: python -c "from promptsentinel.api.app import create_app; create_app()"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  types:
    name: type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Every extra, so the optional modules are type-checked too. mypy cannot check
      # code whose imports it cannot resolve, and shipping unchecked modules is how
      # the optional backends drifted in the first place.
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,postgres,redis]"

      - name: Type check (mypy)
        run: mypy

  postgres:
    name: postgres compatibility
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,postgres]"

      # SQLite is the development default and Postgres the production target. "Written
      # for both" is a claim, and an unverified claim about a database holds right up
      # until a migration runs against real data.
      - name: Postgres compatibility suite
        env:
          PROMPTSENTINEL_TEST_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        run: pytest tests/integration/test_postgres.py -v

  redis:
    name: distributed backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev,redis]"

      # The queue message must never carry a credential, and the worker must be able
      # to recover one the API stored. Neither is observable in single-process mode.
      - name: Distributed backend suite
        env:
          PROMPTSENTINEL_TEST_REDIS_URL: redis://localhost:6379
        run: pytest tests/integration/test_redis_backend.py -v
